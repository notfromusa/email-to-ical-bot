# Reverse proxy for the iCal Bot UI
# SECURITY WARNING: Enable TLS (port 443 server block + HTTP->HTTPS redirect) before exposing remotely.
# Plaintext HTTP is only suitable for local/trusted loopback testing.

limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

upstream ical_bot_app {
    server app:5000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 1m;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Uncomment to force HTTPS after configuring TLS
    # return 301 https://$host$request_uri;

    location = /login {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://ical_bot_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://ical_bot_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}


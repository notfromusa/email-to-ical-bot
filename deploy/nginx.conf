# Basic reverse proxy for the iCal Bot UI
# For TLS, add a server block with ssl_certificate/ssl_certificate_key and map 443.

upstream ical_bot_app {
    server app:5000;
}

server {
    listen 80;
    server_name _;

    # Uncomment to force HTTPS after configuring TLS
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://ical_bot_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}


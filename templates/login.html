<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iCal Bot Login</title>
    <style>
        body {
            font-family: 'Space Grotesk', 'Fira Sans', 'Avenir Next', sans-serif;
            background: radial-gradient(120% 120% at 20% 20%, #1f2d4d 0%, #070b12 70%);
            color: #f5f7ff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .card {
            background: #101b33;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 2rem 2.25rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            width: min(420px, 100%);
        }
        h1 {
            font-size: 1.6rem;
            margin-bottom: 0.5rem;
        }
        p {
            color: #9fb0d3;
            margin-bottom: 1.25rem;
        }
        label {
            display: block;
            margin-bottom: 0.35rem;
            color: #9fb0d3;
            font-size: 0.85rem;
        }
        input {
            width: 100%;
            background: rgba(5, 8, 16, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            padding: 0.6rem 0.75rem;
            color: #f5f7ff;
            margin-bottom: 1rem;
        }
        button {
            width: 100%;
            border: none;
            border-radius: 999px;
            padding: 0.65rem 1rem;
            background: #3dd5a8;
            color: #04140f;
            font-weight: 600;
            cursor: pointer;
        }
        .error {
            color: #ff9d7a;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Sign in</h1>
        <p>Enter your local UI credentials.</p>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="post">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" required>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ical-bot"
version = "0.1.0"
description = "Automated email to calendar invite system using local LLM"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "flask>=3.0.0",
    "exchangelib>=5.0.0",
    "pypdf>=4.2.0",
    "defusedxml>=0.7.1",
    "waitress>=3.0.0",
]

[dependency-groups]
dev = [
    "mypy>=1.14.0",
    "pip-audit>=2.7.0",
    "pytest>=8.3.5",
    "ruff>=0.8.0",
    "types-requests>=2.31.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ical_bot"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
ignore_missing_imports = true

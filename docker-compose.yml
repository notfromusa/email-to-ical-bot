version: '3.9'

services:
  app:
    build: .
    env_file:
      - .env
    environment:
      # Ensure the Flask UI listens on all interfaces inside the container
      - WEB_UI_HOST=0.0.0.0
      # Point to the host Ollama instance; adjust if Ollama runs elsewhere
      - LLM_ENDPOINT=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./templates:/app/templates
    expose:
      - "5000"

  proxy:
    image: nginx:1.25-alpine
    depends_on:
      - app
    ports:
      - "80:80"
      # Uncomment after adding valid TLS certs
      # - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Mount your certs if enabling TLS
      # - ./deploy/certs/fullchain.pem:/etc/nginx/certs/fullchain.pem:ro
      # - ./deploy/certs/privkey.pem:/etc/nginx/certs/privkey.pem:ro
    restart: unless-stopped
